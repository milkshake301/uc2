<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="a.css">

    <title>Marvel Rivals</title>
</head>

<body>

    <header>

        <img src="https://www.marvelrivals.com/pc/gw/20241128194803/img/logo_95906827.png" alt="Logo do Marvel Rivals">

    </header>


    <nav>

        <ul>

            <li>
                <a href="p1.html" target="_blank">
                    Events
                </a>
            </li>

            <li>
                <a href="https://www.marvelrivals.com/news/" target="_blank">
                    News
                </a>
            </li>

            <li>
                <a href="https://www.marvelrivals.com/?part=feature" target="_blank">
                    Game Info
                </a>
            </li>

        </ul>

    </nav>



    <main>
        <section>
            <h2>
                Entre na lista de espera
            </h2>



            <P>
                Para receber as novidades assim que sairem.
            </P>

            <form action="#" method="post" class="lista-de-espera"></form>
            <div class="campo">
                <label for="nome">Nome</label>
                <input 
                type="text"
                id="nome"
                name="nome"
                placeholder="como podemos te chamar?"
                required
                
                
                >

            </div>
        </section>


        <section>


            <form action="#" method="post" class="lista-de-espera"></form>
            <div class="campo">
                <label for="email">E-mail</label>
                <input 
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
                >

            </div>
        </section>


        <section>
            <form action="#" method="post" class="lista-de-espera"></form>
            <div class="campo">
                <label for="telefone">Telefone (opcional)</label>
                <input 
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(21) 90000-0000"
                required
                pattern="\(?\d{2}\)?\s?\d{5,4}\-?\d{4}"
                >

            </div>

        </section>


       

        <section>


            <form action="#" method="post" class="lista-de-espera"></form>
            <div class="campo">
                <label for="idade">Idade</label>
                <input 
                type="number"
                id="idade"
                name="idade"
                min="13"
                placeholder="Sua idade"
                required
                >

            </div>

            <button type="submit">Entrar na lista de espera</button>

            <button type="reset">Limpar Formulário</button>
            
           </form>
        </section>


    </main>



    <footer>

        <p>
            Marvel Rivals Fan Page
        </p>

        <p>
            Site desenvolvido para fins educacionais.
        </p>

    </footer>

</body>

</html>
